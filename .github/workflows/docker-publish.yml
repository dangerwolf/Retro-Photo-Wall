name: Manual Docker Build & Push

# 触发条件：手动触发 (Workflow Dispatch)
# 这样您可以随时点击按钮开始构建，无需提交代码
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (e.g., latest, v1.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Ubuntu 环境

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 QEMU (如果需要跨平台构建，如 ARM64，可以保留此步，不需要可跳过)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx (新一代构建工具，性能更好)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 自动使用您的用户名和输入标签
          tags: ${{ secrets.DOCKER_USERNAME }}/retro-photo-wall:${{ inputs.image_tag }}
          # 使用缓存层加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
